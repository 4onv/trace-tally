name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Test parsing, export boundaries, and report rendering
        run: node --test
      - name: Run the synthetic demonstration
        run: node bin/trace-tally.mjs demo
      - name: Inspect the Claude-format fixture
        run: node bin/trace-tally.mjs inspect examples/claude-small.jsonl --format claude --out .trace-tally/claude-fixture
      - name: Compare neutral-format fixtures
        run: node bin/trace-tally.mjs compare examples/before.jsonl examples/after.jsonl --format events --out .trace-tally/fixture-comparison --fail-on-more-errors
      - name: Rebuild the demonstration report
        run: node bin/trace-tally.mjs report .trace-tally/demo/comparison.json --out .trace-tally/rebuilt
      - name: Upload only the demonstration report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-${{ matrix.os }}-node-${{ matrix.node }}
          path: .trace-tally/demo/
          include-hidden-files: true
